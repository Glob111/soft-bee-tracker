name: CI Checks

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SECRET_KEY: ci-canary-secret-must-never-reach-client-7f3c9a
  PLAYWRIGHT_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  PLAYWRIGHT_SUPABASE_SECRET_KEY: ci-canary-secret-must-never-reach-client-7f3c9a

jobs:
  checks:
    name: Lint, Unit Tests, Build & E2E Safeguards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint checks
        run: yarn lint:ci

      - name: Run unit and safeguard tests (Vitest)
        run: yarn test

      - name: Build Next.js production bundle
        run: yarn build

      - name: Verify client-delivered output contains no server-side secrets
        run: |
          # .next/static = JS/CSS bundles; .next/server/app *.html/*.rsc/*.body = prerendered pages and RSC payloads sent to the browser.
          for dir in .next/static .next/server/app; do
            if [ ! -d "$dir" ]; then
              echo "Error: expected build output directory $dir is missing"
              exit 1
            fi
          done
          # grep exits 1 for "no match" and 2 for errors; treat errors as failures instead of a clean result.
          search_client_output() {
            local status
            grep -R -l "$@" .next/static/ && return 0
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Error: grep failed on .next/static (exit $status)"
              exit 1
            fi
            grep -R -l --include='*.html' --include='*.rsc' --include='*.body' "$@" .next/server/app/ && return 0
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Error: grep failed on .next/server/app (exit $status)"
              exit 1
            fi
            return 1
          }
          if search_client_output -F "$SUPABASE_SECRET_KEY"; then
            echo "Error: SUPABASE_SECRET_KEY value leaked into client-delivered output"
            exit 1
          fi
          if search_client_output -E "sb_secret_[A-Za-z0-9_-]+"; then
            echo "Error: Supabase secret key found in client-delivered output"
            exit 1
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Chromium browser
        run: yarn playwright install --with-deps chromium

      - name: Run Playwright E2E safeguard tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    name: Migrations, Seeds & DB Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Apply migrations and seeds to a clean local database
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Verify seeded test accounts and roles
        run: |
          actual=$(docker exec supabase_db_soft_bee_tracker psql -U postgres -tAc \
            "select string_agg(email || ':' || role || ':' || is_confirmed, ',' order by email) from public.users where email like '%@softbee.dev'")
          expected="admin@softbee.dev:admin:true,manager@softbee.dev:manager:true,worker@softbee.dev:worker:true"
          if [ "$actual" != "$expected" ]; then
            echo "Error: unexpected seeded users"
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi

      - name: Verify generated DB types are up to date
        run: |
          supabase gen types typescript --local | tail +1 > src/types/supabase-schema.ts
          git diff --exit-code -- src/types/supabase-schema.ts || {
            echo "Error: src/types/supabase-schema.ts is out of date — run 'yarn sb:db:types' and commit the result"
            exit 1
          }

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
